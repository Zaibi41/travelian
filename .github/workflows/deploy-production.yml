name: Deploy website

# Every push to main is checked, built with .env.production and uploaded to the
# travelian.pk S3 bucket behind CloudFront. AWS access is short-lived (GitHub OIDC
# role, no stored keys); the role can upload and refresh CloudFront, never delete.
# Uploaded content in the bucket (package-images/, airline-logos/, payments/,
# invoice-assets/, icons/, the domain-verification file) is never removed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: website-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  BUCKET: travelian.pk
  DISTRIBUTION_ID: E2CTXNUWHCTZ62

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the build
        run: |
          set -euo pipefail
          test -f dist/index.html
          ls dist/assets/*.js >/dev/null
          # The production build must call the production API, never a local server
          # (React Router's own "http://localhost" placeholder has no port).
          if grep -rqE "(localhost|127\.0\.0\.1):[0-9]" dist/assets/*.js; then
            echo "Build points at localhost; check .env.production"; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload files
        run: |
          set -euo pipefail
          # Hashed bundles never change: cache for a year.
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors
          # Everything else except index.html: short cache.
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=300" --only-show-errors
          # index.html last, never cached, so visitors only get it once its bundles exist.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
