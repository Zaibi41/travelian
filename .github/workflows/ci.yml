name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Static public pages as HTML for crawlers (uses the runner's Google Chrome).
      - run: npm run prerender
  e2e:
    # Playwright specs in e2e/ci-specs.txt against the dev server (started by playwright.config.ts). Every gateway call
    # is answered inside the spec (page.route), so nothing reaches a real gateway or supplier. A failure fails the check;
    # a test that fails once and then passes is retried once and reported as "flaky" (fix it, don't ignore it).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The specs run on the runner's Google Chrome (playwright.config.ts channel "chrome").
      - run: npx playwright test $(grep -v '^#' e2e/ci-specs.txt | tr '\n' ' ') --trace off --workers=2 --retries=1 --reporter=line
        env:
          # A local gateway address that nothing listens on: the dev server proxies /__gateway there and every spec
          # answers those calls itself (e2e/support/gateway.ts). Without it the admin says the gateway isn't configured.
          VITE_TRAVELIAN_GATEWAY_BASE_URL: http://localhost:8000
  lint:
    # Existing lint debt is visible without blocking unrelated configuration work.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
